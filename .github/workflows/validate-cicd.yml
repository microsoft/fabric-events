name: Validate Fabric scenario deployment assets

on:
  pull_request:
    paths:
      - 'cicd/**'
      - 'docs/**'
      - 'overrides/**'
      - 'tests/test_deployment_docs.py'
      - 'tests/test_*public_cicd.py'
      - 'tests/test_business_actions.py'
      - 'tests/scenario-diagram-layout.test.mjs'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.github/workflows/validate-cicd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate nested scenario deployment guides
        run: python -m unittest discover -s tests -p "test_deployment_docs.py" -v
      - name: Build documentation with deployment references
        run: python -m mkdocs build --strict
      - name: Test deployment assets without cloud credentials
        run: |
          python -m unittest discover -s tests -p "test_*public_cicd.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p "test_business_actions.py" -v
      - name: Test shared diagram layout
        run: node --test tests\scenario-diagram-layout.test.mjs
      - name: Validate the unbound offline deployment plans
        shell: pwsh
        run: |
          foreach ($scenario in @(
            'sales-volume-alert',
            'real-time-stream-alert',
            'discount-approval-routing',
            'low-stock-threshold',
            'revenue-below-target',
            'fraud-response-before-fulfillment',
            'real-time-viewer-recommendations',
            'abandoned-cart-recovery',
            'data-pipeline-failure-follow-up',
            'customer-loyalty-milestone'
          )) {
            python ".\cicd\$scenario\deploy.py" plan
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
