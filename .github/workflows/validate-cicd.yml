name: Validate Fabric scenario deployment assets

on:
  pull_request:
    paths:
      - 'cicd/**'
      - 'docs/business-events/scenarios/**'
      - 'tests/test_deployment_docs.py'
      - 'tests/test_risk*.py'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.github/workflows/validate-cicd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate nested scenario deployment guides
        run: python -m unittest discover -s tests -p "test_deployment_docs.py" -v
      - name: Build documentation with deployment references
        run: python -m mkdocs build --strict
      - name: Test deployment assets without cloud credentials
        shell: pwsh
        run: |
          foreach ($scenario in @(
            'sales-volume-alert',
            'high-value-payment',
            'discount-approval-routing',
            'low-stock-threshold',
            'fraud-response-before-fulfillment'
          )) {
            python -m unittest discover -s ".\cicd\$scenario\tests" -v
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Validate the unbound offline deployment plans
        shell: pwsh
        run: |
          foreach ($scenario in @(
            'sales-volume-alert',
            'high-value-payment',
            'discount-approval-routing'
          )) {
            python ".\cicd\$scenario\deploy.py" plan
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Test Risk configuration, native connections and resumable fulfillment
        shell: pwsh
        run: python -m unittest discover -s .\tests -p "test_risk*.py" -v
      - name: Validate the unbound Risk deployment plan
        shell: pwsh
        run: python .\cicd\fraud-response-before-fulfillment\card.py plan
